<!doctype html>
<html lang="en">

        <meta charset="UTF-8" />

        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: #0f172a;
                color: white;
                text-align: center;
                padding: 20px;
            }
            header {
                margin-bottom: 20px;
            }
            select {
                padding: 10px 16px;
                font-size: 18px;
                border-radius: 6px;
                border: none;
                background: #1e293b;
                color: white;
                cursor: pointer;
            }
            #scene {
                position: relative;
                width: 90%;
                max-width: 900px;
                height: 400px;
                margin: 20px auto;
                overflow: hidden;
                border-radius: 12px;
                background: #011428;
            }
            .waves {
                position: absolute;
                bottom: 0;
                width: 200%;
                height: 60px;
            }
            .wave1 {
                fill: rgba(255, 255, 255, 0.3);
                animation: waveMove 8s infinite linear;
            }
            .wave2 {
                fill: rgba(255, 255, 255, 0.15);
                animation: waveMove 6s infinite linear reverse;
            }
            @keyframes waveMove {
                0% {
                    transform: translateX(0);
                }
                100% {
                    transform: translateX(-50%);
                }
            }
            .notes,
            .desc {
                margin: 12px 0;
                font-size: 18px;
            }
            .youtube-container {
                position: relative;
                padding-bottom: 56.25%; /* 16:9 aspect ratio */
                height: 0;
                overflow: hidden;
                max-width: 700px;
                margin: 20px auto;
                border-radius: 8px;
                background: #000;
            }
            .youtube-container iframe {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border: 0;
            }
            #errorMsg {
                color: #f87171;
                font-weight: bold;
                margin: 10px;
                min-height: 20px;
            }
            #videoStatus {
                color: #94a3b8;
                font-size: 14px;
                margin: 5px 0;
            }
            .placeholder-video {
                padding: 40px 20px;
                color: #94a3b8;
                font-style: italic;
            }
        </style>
    </head>

            <svg class="waves" viewBox="0 0 1200 60" preserveAspectRatio="none">

                    d="M0 40 Q300 70 600 40 T1200 40 V60 H0 Z"
                ></path>
                <path
                    class="wave2"
                    d="M0 40 Q300 10 600 40 T1200 40 V60 H0 Z"
                ></path>
            </svg>
        </div>

        <div class="desc" id="descDisplay"></div>

                    encrypted-media;
                    gyroscope;
                    picture-in-picture;
                    web-share;
                "
                allowfullscreen
                loading="lazy"
                title="Raga Demo Video"
            ></iframe>
        </div>

        <div id="videoStatus">🎬 Select a raga to load video</div>
        <div id="errorMsg"></div>

                },
            ];

            const select = document.getElementById("ragaSelect");
            ragas.forEach((raga, i) => {
                const opt = document.createElement("option");
                opt.value = i;
                opt.textContent = raga.name;
                select.appendChild(opt);
            });

            const iframe = document.getElementById("playerIframe");
            const errorMsg = document.getElementById("errorMsg");
            const videoStatus = document.getElementById("videoStatus");

            function updateScene(index) {
                const r = ragas[index];

                // Update UI text
                document.getElementById("notesDisplay").textContent =
                    `Arohana / Notes: ${r.notes}`;
                document.getElementById("descDisplay").textContent =
                    `${r.name} – Melakarta Raga`;
                document.getElementById("scene").style.background =
                    `linear-gradient(to top, ${r.mood}88 0%, #011428 100%)`;

                // Reset messages
                errorMsg.textContent = "";
                videoStatus.textContent = `🎬 Loading: ${r.name}...`;

                if (r.youtubeId && r.youtubeId.trim() !== "") {
                    // ✅ FIXED: Removed trailing spaces in URL + added proper params
                    iframe.src = `https://www.youtube.com/embed/${r.youtubeId}?rel=0&modestbranding=1&playsinline=1`;

                    // Show status when video loads
                    iframe.onload = () => {
                        videoStatus.textContent = `✅ Ready: ${r.name}`;
                    };

                    // Handle embed errors
                    iframe.onerror = () => {
                        errorMsg.textContent =
                            "❌ Failed to load video. Try refreshing.";
                        videoStatus.textContent = "";
                    };
                } else {
                    iframe.src = "";
                    videoStatus.textContent = "";
                    errorMsg.textContent =
                        "🎵 No demo video available for this raga yet.";
                }
            }

            // Initialize particles (fixed URL)
            particlesJS("particles-js", {
                particles: {
                    number: { value: 80 },
                    color: { value: "#ffffff" },
                    shape: { type: "circle" },
                    opacity: { value: 0.5 },
                    size: { value: 3 },
                    move: { speed: 1 },
                },
                interactivity: {
                    events: { onhover: { enable: true, mode: "repulse" } },
                },
            });

            // Initialize with first raga
            updateScene(0);

            // Handle dropdown change (parse as integer)
            select.addEventListener("change", (e) =>
                updateScene(parseInt(e.target.value, 10)),
            );
