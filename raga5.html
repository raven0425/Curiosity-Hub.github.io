<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Melakarta Raga Atlas – 36 Ragas</title>
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: #0f172a;
                color: white;
                text-align: center;
                padding: 20px;
            }
            header {
                margin-bottom: 20px;
            }
            select {
                padding: 10px 16px;
                font-size: 18px;
                border-radius: 6px;
                border: none;
                background: #1e293b;
                color: white;
                cursor: pointer;
            }
            #scene {
                position: relative;
                width: 90%;
                max-width: 900px;
                height: 400px;
                margin: 20px auto;
                overflow: hidden;
                border-radius: 12px;
                background: #011428;
            }
            .waves {
                position: absolute;
                bottom: 0;
                width: 200%;
                height: 60px;
            }
            .wave1 {
                fill: rgba(255, 255, 255, 0.3);
                animation: waveMove 8s infinite linear;
            }
            .wave2 {
                fill: rgba(255, 255, 255, 0.15);
                animation: waveMove 6s infinite linear reverse;
            }
            @keyframes waveMove {
                0% {
                    transform: translateX(0);
                }
                100% {
                    transform: translateX(-50%);
                }
            }
            .notes,
            .desc {
                margin: 12px 0;
                font-size: 18px;
            }
            .desc {
                font-size: 24px;
                font-weight: bold;
                background: linear-gradient(90deg, var(--raga-mood), white);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                animation: glow 2s infinite alternate;
                margin: 20px 0;
            }
            @keyframes glow {
                from {
                    text-shadow: 0 0 10px var(--raga-mood-88);
                }
                to {
                    text-shadow: 0 0 20px var(--raga-mood);
                }
            }
            #swaraDisplay {
                font-size: 28px;
                letter-spacing: 8px;
                margin: 15px 0;
                animation: fadeIn 1s ease-in;
            }
            #swaraDisplay span {
                transition: all 0.3s;
                animation: pulse 2s infinite;
            }
            #swaraDisplay span:hover {
                transform: scale(1.2);
                text-shadow: 0 0 10px var(--raga-mood);
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.7;
                }
            }
            .youtube-container {
                position: relative;
                padding-bottom: 56.25%;
                height: 0;
                overflow: hidden;
                max-width: 700px;
                margin: 20px auto;
                border-radius: 8px;
                background: #000;
            }
            .youtube-container iframe {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border: 0;
            }
            .loading {
                border: 4px solid #1e293b;
                border-top: 4px solid var(--raga-mood);
                border-radius: 50%;
                width: 30px;
                height: 30px;
                animation: spin 1s linear infinite;
                margin: 10px auto;
                display: none; /* Hidden until loading */
            }
            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
            #errorMsg {
                color: #f87171;
                font-weight: bold;
                margin: 10px;
            }
            #videoStatus {
                color: #94a3b8;
                font-size: 14px;
                margin: 5px 0;
            }
            /* Responsive for mobile */
            @media (max-width: 600px) {
                select {
                    width: 100%;
                    font-size: 16px;
                }
                .youtube-container {
                    max-width: 100%;
                }
                h1 {
                    font-size: 1.8rem;
                }
                #scene {
                    width: 100%;
                    height: 300px;
                }
                #swaraDisplay {
                    font-size: 22px;
                    letter-spacing: 4px;
                }
                .desc {
                    font-size: 20px;
                }
            }
        </style>
    </head>
    <body>
        <h1>Melakarta Raga Atlas – 36 Ragas</h1>
        <p>Select a raga to see its landscape & watch a YouTube demo</p>
        <select id="ragaSelect"></select>
        <div id="scene">
            <div id="particles-js"></div>
            <svg class="waves" viewBox="0 0 1200 60" preserveAspectRatio="none">
                <path
                    class="wave1"
                    d="M0 40 Q300 70 600 40 T1200 40 V60 H0 Z"
                ></path>
                <path
                    class="wave2"
                    d="M0 40 Q300 10 600 40 T1200 40 V60 H0 Z"
                ></path>
            </svg>
        </div>
        <div class="notes" id="notesDisplay"></div>
        <div id="swaraDisplay"></div>
        <div class="desc" id="descDisplay"></div>
        <div class="youtube-container">
            <iframe
                id="playerIframe"
                src=""
                allow="
                    accelerometer;
                    autoplay;
                    clipboard-write;
                    encrypted-media;
                    gyroscope;
                    picture-in-picture;
                    web-share;
                "
                allowfullscreen
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"
                title="Raga Demo Video"
            >
            </iframe>
        </div>
        <div id="videoStatus">🎬 Select a raga</div>
        <div class="loading" id="spinner"></div>
        <div id="errorMsg"></div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
        <script>
            const ragas = [
                {
                    name: "Kanakangi",
                    notes: "S R1 G1 M1 P D1 N1 S",
                    mood: "#f87171",
                    youtubeId: "RncnfQKhLzY",
                },
                {
                    name: "Ratnangi",
                    notes: "S R1 G1 M1 P D1 N2 S",
                    mood: "#fbbf24",
                    youtubeId: "REmEGWy5D4k",
                },
                {
                    name: "Ganamurti",
                    notes: "S R1 G1 M1 P D2 N2 S",
                    mood: "#34d399",
                    youtubeId: "cs1SwomIsuI",
                },
                {
                    name: "Vanaspati",
                    notes: "S R1 G1 M1 P D2 N2 S",
                    mood: "#60a5fa",
                    youtubeId: "bShSYieL5m8",
                },
                {
                    name: "Manavati",
                    notes: "S R1 G2 M1 P D1 N1 S",
                    mood: "#f472b6",
                    youtubeId: "rBQ-A69WoDY",
                },
                {
                    name: "Tanarupi",
                    notes: "S R1 G2 M1 P D1 N2 S",
                    mood: "#facc15",
                    youtubeId: "REmEGWy5D4k",
                },
                {
                    name: "Senavati",
                    notes: "S R1 G2 M1 P D2 N2 S",
                    mood: "#22d3ee",
                    youtubeId: "REmEGWy5D4k",
                },
                {
                    name: "Hanumatodi",
                    notes: "S R1 G2 M1 P D1 N2 S",
                    mood: "#f43f5e",
                    youtubeId: "739A-p5WbMs",
                },
                {
                    name: "Dhenuka",
                    notes: "S R1 G2 M1 P D2 N2 S",
                    mood: "#a78bfa",
                    youtubeId: "739A-p5WbMs",
                },
                {
                    name: "Natakapriya",
                    notes: "S R1 G3 M1 P D1 N1 S",
                    mood: "#f97316",
                    youtubeId: "6KVlRXkZaI8",
                },
                {
                    name: "Kokilapriya",
                    notes: "S R1 G3 M1 P D1 N2 S",
                    mood: "#14b8a6",
                    youtubeId: "6KVlRXkZaI8",
                },
                {
                    name: "Rupavati",
                    notes: "S R1 G3 M1 P D2 N2 S",
                    mood: "#f43f5e",
                    youtubeId: "6KVlRXkZaI8",
                },
                {
                    name: "Gayakapriya",
                    notes: "S R2 G1 M1 P D1 N1 S",
                    mood: "#22c55e",
                    youtubeId: "6KVlRXkZaI8",
                },
                {
                    name: "Vakulabharanam",
                    notes: "S R2 G1 M1 P D1 N2 S",
                    mood: "#60a5fa",
                    youtubeId: "6KVlRXkZaI8",
                },
                {
                    name: "Mayamalavagowla",
                    notes: "S R1 G3 M1 P D1 N3 S",
                    mood: "#fbbf24",
                    youtubeId: "BES_G8-oKwk",
                },
                {
                    name: "Chakravakam",
                    notes: "S R1 G3 M1 P D2 N3 S",
                    mood: "#f472b6",
                    youtubeId: "BES_G8-oKwk",
                },
                {
                    name: "Suryakantam",
                    notes: "S R2 G2 M1 P D1 N2 S",
                    mood: "#34d399",
                    youtubeId: "yXmSvVSDSqk",
                },
                {
                    name: "Hatakambari",
                    notes: "S R2 G2 M1 P D2 N2 S",
                    mood: "#f87171",
                    youtubeId: "yXmSvVSDSqk",
                },
                {
                    name: "Jhankaradhvani",
                    notes: "S R2 G2 M1 P D2 N3 S",
                    mood: "#facc15",
                    youtubeId: "yXmSvVSDSqk",
                },
                {
                    name: "Natabhairavi",
                    notes: "S R2 G2 M1 P D1 N1 S",
                    mood: "#22d3ee",
                    youtubeId: "yXmSvVSDSqk",
                },
                {
                    name: "Kharaharapriya",
                    notes: "S R2 G2 M1 P D2 N2 S",
                    mood: "#f43f5e",
                    youtubeId: "9mUurcBD4o4",
                },
                {
                    name: "Gourimanohari",
                    notes: "S R2 G3 M1 P D2 N3 S",
                    mood: "#a78bfa",
                    youtubeId: "9mUurcBD4o4",
                },
            ];
            const select = document.getElementById("ragaSelect");
            const iframe = document.getElementById("playerIframe");
            const errorMsg = document.getElementById("errorMsg");
            const videoStatus = document.getElementById("videoStatus");
            const spinner = document.getElementById("spinner");
            const swaraDisplay = document.getElementById("swaraDisplay");
            const descDisplay = document.getElementById("descDisplay");
            const scene = document.getElementById("scene");
            const wave1 = document.querySelector(".wave1");
            const wave2 = document.querySelector(".wave2");
            ragas.forEach((r, i) => {
                const opt = document.createElement("option");
                opt.value = i;
                opt.textContent = r.name;
                select.appendChild(opt);
            });
            function updateScene(i) {
                const r = ragas[i];
                document.getElementById("notesDisplay").textContent =
                    "Arohana / Notes: " + r.notes;
                descDisplay.textContent = r.name + " – Melakarta Raga";
                scene.style.background = `linear-gradient(to top, ${r.mood}88 0%, #011428 100%)`;
                // Glow & gradient for desc (dynamic CSS vars)
                descDisplay.style.setProperty("--raga-mood", r.mood);
                descDisplay.style.setProperty("--raga-mood-88", r.mood + "88");
                // Wave color sync
                wave1.style.fill = r.mood + "55";
                wave2.style.fill = r.mood + "33";
                // Animated swaras
                swaraDisplay.innerHTML = r.notes
                    .split(" ")
                    .map(
                        (s) =>
                            `<span style="color:${s === "S" ? "#fff" : r.mood}">${s}</span>`,
                    )
                    .join(" ");
                errorMsg.textContent = "";
                videoStatus.textContent = "Loading " + r.name + "...";
                spinner.style.display = "block"; // Show spinner
                const origin = location.origin || "http://localhost";
                iframe.src = `https://www.youtube-nocookie.com/embed/${r.youtubeId}?rel=0&modestbranding=1&playsinline=1&enablejsapi=1&origin=${origin}`;
                // Particles reload with mood
                particlesJS("particles-js", {
                    particles: {
                        number: { value: 80 + i * 2 }, // More for later ragas
                        color: { value: r.mood },
                        shape: { type: "circle" },
                        opacity: { value: 0.5 },
                        size: { value: 3 },
                        move: { speed: 1 },
                    },
                    interactivity: {
                        events: { onhover: { enable: true, mode: "repulse" } },
                    },
                });
                iframe.onload = () => {
                    spinner.style.display = "none";
                    videoStatus.textContent = "✅ Ready: " + r.name;
                };
            }
            select.addEventListener("change", (e) => {
                updateScene(parseInt(e.target.value));
            });
            updateScene(0);
        </script>
    </body>
</html>
