<style>
* { box-sizing: border-box; }
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:white;
  text-align:center;
  padding:20px;
  line-height:1.5;
}
header { margin-bottom:20px; }
h1 { 
  margin:0 0 10px; 
  font-size:2rem;
  background:linear-gradient(90deg,#f87171,#fbbf24,#34d399,#60a5fa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
select{
  padding:10px 16px;
  font-size:18px;
  border-radius:6px;
  border:none;
  background:#1e293b;
  color:white;
  cursor:pointer;
  max-width:100%;
  width:300px;
}
select:hover { background:#334155; }
#scene{
  position:relative;
  width:90%;
  max-width:900px;
  height:400px;
  margin:20px auto;
  overflow:hidden;
  border-radius:12px;
  background:#011428;
  box-shadow:0 10px 40px rgba(0,0,0,0.4);
}

/* === LAYERING FIX: Scenery on top, particles behind === */
#sceneryOverlay {
  position:absolute;
  top:0; left:0; right:0; bottom:0;
  pointer-events:none;
  z-index:10;
  border-radius:12px;
  overflow:hidden;
}
#particles-js {
  position:absolute;
  top:0; left:0; right:0; bottom:0;
  z-index:5;
}
#particles-js canvas { z-index:5 !important; }
.waves{
  position:absolute;
  bottom:0;
  width:200%;
  height:60px;
  z-index:20;
}
.wave1{
  fill:rgba(255,255,255,.3);
  animation:waveMove 8s infinite linear;
}
.wave2{
  fill:rgba(255,255,255,.15);
  animation:waveMove 6s infinite linear reverse;
}
@keyframes waveMove{
  0%{transform:translateX(0)}
  100%{transform:translateX(-50%)}
}

/* === SCENERY BACKGROUNDS (Enhanced Visibility) === */
.moonlit-pond { 
  background:linear-gradient(to bottom, rgba(100,150,255,0.5), rgba(50,50,100,0.6)); 
  animation:moonlight 15s infinite ease-in-out; 
}
.moonlit-pond::before {
  content:""; position:absolute; top:30px; right:60px; width:40px; height:40px;
  background:radial-gradient(circle,#fff 0%,rgba(255,255,200,0.8) 40%,transparent 70%);
  border-radius:50%; box-shadow:0 0 30px rgba(200,220,255,0.6);
  animation:pulse 4s infinite ease-in-out;
}
.moonlit-pond::after {
  content:""; position:absolute; top:0; left:0; right:0; bottom:0;
  background-image:radial-gradient(rgba(255,255,255,0.3) 1px, transparent 1px);
  background-size:50px 50px; opacity:0.4;
}

.dawn-gaze { 
  background:linear-gradient(to bottom, rgba(255,200,100,0.5), rgba(255,150,50,0.6)); 
  animation:sunrise 20s infinite ease-in-out; 
}
.dawn-gaze::before {
  content:""; position:absolute; bottom:20%; left:10%; width:80px; height:80px;
  background:radial-gradient(circle,#fff7e6 0%,rgba(255,200,100,0.6) 50%,transparent 80%);
  border-radius:50%; filter:blur(10px);
}

.fiery-sunset { 
  background:linear-gradient(to bottom, rgba(255,100,50,0.6), rgba(150,50,0,0.5)); 
  animation:sunset 18s infinite ease-in-out; 
}
.fiery-sunset::before {
  content:""; position:absolute; bottom:0; left:0; right:0; height:30%;
  background:linear-gradient(to top, rgba(100,30,0,0.8), transparent);
}

.ancient-forest { 
  background:linear-gradient(to bottom, rgba(50,150,50,0.5), rgba(0,100,0,0.6)); 
  animation:forest 25s infinite ease-in-out; 
}
.ancient-forest::before {
  content:""; position:absolute; bottom:0; left:10%; width:15%; height:60%;
  background:linear-gradient(to top, #2d5016, transparent);
  border-radius:50% 50% 0 0;
  box-shadow:30px 0 0 #1a3009, 60px 0 0 #2d5016, 90px 0 0 #1a3009;
}

.dynamic-river { 
  background:linear-gradient(to bottom, rgba(100,200,255,0.5), rgba(50,150,200,0.6)); 
  animation:river 12s infinite ease-in-out; 
}
.dynamic-river::after {
  content:""; position:absolute; bottom:10%; left:-100%; width:200%; height:20%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation:flow 3s infinite linear;
}
@keyframes flow { 0%{transform:translateX(0)} 100%{transform:translateX(50%)} }

.blooming-garden { 
  background:linear-gradient(to bottom, rgba(255,150,200,0.5), rgba(200,100,150,0.6)); 
  animation:bloom 16s infinite ease-in-out; 
}
.blooming-garden::before {
  content:"🌸"; position:absolute; font-size:24px; top:20%; left:15%; 
  animation:float 3s infinite ease-in-out;
}
.blooming-garden::after {
  content:"🌺"; position:absolute; font-size:20px; bottom:25%; right:20%; 
  animation:float 4s infinite ease-in-out reverse;
}
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

.sage-mountain { 
  background:linear-gradient(to bottom, rgba(150,150,150,0.5), rgba(100,100,100,0.6)); 
  animation:mountain 22s infinite ease-in-out; 
}
.sage-mountain::before {
  content:""; position:absolute; bottom:0; left:0; right:0; height:40%;
  background:linear-gradient(to top, #555, transparent);
  clip-path:polygon(0% 100%, 20% 60%, 40% 80%, 60% 50%, 80% 70%, 100% 40%, 100% 100%);
}

.deity-temple { 
  background:linear-gradient(to bottom, rgba(255,255,200,0.5), rgba(200,200,100,0.6)); 
  animation:temple 20s infinite ease-in-out; 
}
.deity-temple::before {
  content:"🛕"; position:absolute; bottom:10%; left:50%; transform:translateX(-50%);
  font-size:40px; filter:drop-shadow(0 0 10px rgba(255,215,0,0.8));
}

.cosmic-night { 
  background:linear-gradient(to bottom, rgba(50,0,100,0.6), rgba(100,0,200,0.5)); 
  animation:cosmic 30s infinite ease-in-out; 
}
.cosmic-night::before {
  content:""; position:absolute; top:0; left:0; right:0; bottom:0;
  background-image:radial-gradient(rgba(255,255,255,0.8) 1px, transparent 1px);
  background-size:30px 30px; opacity:0.6;
  animation:twinkle 2s infinite alternate;
}
@keyframes twinkle { 0%{opacity:0.4} 100%{opacity:0.8} }

.windy-plains { 
  background:linear-gradient(to bottom, rgba(200,200,150,0.5), rgba(150,150,100,0.6)); 
  animation:wind 14s infinite ease-in-out; 
}
.windy-plains::after {
  content:""; position:absolute; top:30%; left:-50%; width:200%; height:2px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
  animation:breeze 4s infinite linear;
}
@keyframes breeze { 0%{transform:translateX(0)} 100%{transform:translateX(100%)} }

.stormy-twilight { 
  background:linear-gradient(to bottom, rgba(100,100,200,0.6), rgba(50,50,150,0.5)); 
  animation:storm 10s infinite ease-in-out; 
}
.stormy-twilight::before {
  content:"⚡"; position:absolute; font-size:30px; top:15%; right:20%; 
  animation:flash 0.5s infinite alternate; opacity:0;
}
@keyframes flash { 0%{opacity:0; transform:scale(0.8)} 100%{opacity:1; transform:scale(1.2)} }

.bright-midday { 
  background:linear-gradient(to bottom, rgba(255,255,100,0.5), rgba(255,200,50,0.6)); 
  animation:midday 18s infinite ease-in-out; 
}
.bright-midday::before {
  content:"☀️"; position:absolute; top:20px; right:40px; font-size:36px;
  animation:shine 3s infinite ease-in-out;
}
@keyframes shine { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3)} }

/* Animation Keyframes */
@keyframes sunrise { 0%{opacity:0.4} 50%{opacity:0.7} 100%{opacity:0.4} }
@keyframes sunset { 0%{opacity:0.5} 50%{opacity:0.8} 100%{opacity:0.5} }
@keyframes forest { 0%,100%{opacity:0.4} 50%{opacity:0.6} }
@keyframes river { 0%{transform:translateX(0)} 100%{transform:translateX(-20px)} }
@keyframes bloom { 0%,100%{opacity:0.5} 50%{opacity:0.7; transform:scale(1.02)} }
@keyframes mountain { 0%{opacity:0.4} 100%{opacity:0.6} }
@keyframes temple { 0%,100%{opacity:0.4} 50%{opacity:0.7} }
@keyframes cosmic { 0%{opacity:0.3} 50%{opacity:0.5} 100%{opacity:0.3} }
@keyframes wind { 0%{opacity:0.4} 50%{opacity:0.6; transform:translateX(10px)} 100%{opacity:0.4} }
@keyframes storm { 0%,100%{opacity:0.5} 50%{opacity:0.8} }
@keyframes midday { 0%{opacity:0.4} 50%{opacity:0.6} 100%{opacity:0.4} }
@keyframes moonlight { 0%,100%{opacity:0.5} 50%{opacity:0.8} }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }

/* Text & UI Styles */
.notes,.desc{ margin:12px 0; font-size:18px; }
.desc {

#swaraDisplay {

#swaraDisplay span {

}
#swaraDisplay span:hover {

}
@keyframes fadeIn { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }

.youtube-container{

.youtube-container iframe{

.loading {

@keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
#errorMsg{ color:#f87171; font-weight:bold; margin:10px; min-height:20px; }
#videoStatus{ color:#94a3b8; font-size:14px; margin:5px 0; }

// DOM Elements
const select = document.getElementById("ragaSelect");
const iframe = document.getElementById("playerIframe");
const errorMsg = document.getElementById("errorMsg");
const videoStatus = document.getElementById("videoStatus");
const spinner = document.getElementById("spinner");
const swaraDisplay = document.getElementById("swaraDisplay");
const descDisplay = document.getElementById("descDisplay");
const scene = document.getElementById("scene");
const wave1 = document.querySelector('.wave1');
const wave2 = document.querySelector('.wave2');
const overlay = document.getElementById("sceneryOverlay");

// Populate dropdown
ragas.forEach((r,i)=>{
  const opt = document.createElement("option");
  opt.value = i;
  opt.textContent = `${r.number}. ${r.name}`;
  select.appendChild(opt);
});

// Update scene function
function updateScene(i){
  const r = ragas[i];
  
  // Update text displays
  document.getElementById("notesDisplay").textContent = "Arohana: " + r.notes;
  descDisplay.textContent = r.name + " – Raga #" + r.number + " (Chakra " + r.chakra + ")";
  
  // Update scene background gradient
  scene.style.background = `linear-gradient(to top, ${r.mood}88 0%, #011428 100%)`;
  
  // Set CSS variables for glow effect
  descDisplay.style.setProperty('--raga-mood', r.mood);
  descDisplay.style.setProperty('--raga-mood-88', r.mood + '88');
  
  // Sync wave colors with raga mood
  wave1.style.fill = r.mood + '55';
  wave2.style.fill = r.mood + '33';
  
  // Animated swara notes
  swaraDisplay.innerHTML = r.notes.split(' ').map(s => 
    `<span style="color:${s==='S' ? '#fff' : r.mood}">${s}</span>`
  ).join(' ');
  
  // === SCENERY OVERLAY FIX: Force class change with reflow ===
  overlay.className = '';
  overlay.offsetHeight; // Force browser reflow
  overlay.className = r.scenery || '';
  
  // Reset messages
  errorMsg.textContent = "";
  videoStatus.textContent = "Loading " + r.name + "...";
  spinner.style.display = 'block';
  
  // YouTube embed with fixed URL (no trailing spaces!)
  const origin = location.origin || "http://localhost";
  if (r.youtubeId && r.youtubeId.trim() !== "") {
    iframe.src = `https://www.youtube-nocookie.com/embed/${r.youtubeId}?rel=0&modestbranding=1&playsinline=1&enablejsapi=1&origin=${encodeURIComponent(origin)}`;
    iframe.onload = () => {
      spinner.style.display = 'none';
      videoStatus.textContent = "✅ Ready: " + r.name;
    };
    iframe.onerror = () => {
      spinner.style.display = 'none';
      errorMsg.textContent = "❌ Video blocked. Try http://localhost";
    };
  } else {
    iframe.src = '';
    spinner.style.display = 'none';
    videoStatus.textContent = "🎵 Search YouTube: '" + r.name + " alapana'";
  }
  
  // Initialize particles with raga mood
  particlesJS("particles-js",{
    particles:{
      number:{value:80 + Math.round(r.number * 0.5)},
      color:{value:r.mood},
      shape:{type:"circle"},
      opacity:{value:0.5},
      size:{value:3},
      move:{speed:1, direction:"none", out_mode:"out"}
    },
    interactivity:{
      events:{onhover:{enable:true,mode:"repulse"}},
      modes:{repulse:{distance:100, duration:0.4}}
    }
  });
}

// Event listeners
select.addEventListener("change",(e)=> updateScene(parseInt(e.target.value)));

// Initialize
updateScene(0);

// Particles.js config
particlesJS("particles-js",{
  particles:{
    number:{value:80},
    color:{value:"#ffffff"},
    shape:{type:"circle"},
    opacity:{value:0.5},
    size:{value:3},
    move:{speed:1}
  },
  interactivity:{
    events:{onhover:{enable:true,mode:"repulse"}}
  }
});
</script>
