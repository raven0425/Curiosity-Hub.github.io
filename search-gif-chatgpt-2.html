<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>Tamil Visual Search 2026</title>
    <style>
        :root { --bg: #0f172a; --accent: #f43f5e; --card: #1e293b; }
        body { font-family: 'Segoe UI', system-ui; background: var(--bg); color: white; padding: 20px; }
        .controls { background: var(--card); padding: 20px; border-radius: 12px; max-width: 600px; margin: 0 auto 30px; }
        input { padding: 12px; width: 60%; border-radius: 6px; border: none; }
        button { padding: 12px 20px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .item { background: var(--card); padding: 5px; border-radius: 8px; position: relative; }
        img { width: 100%; border-radius: 5px; height: 150px; object-fit: cover; }
        .badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); font-size: 10px; padding: 2px 5px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="controls">
        <h2>நகைச்சுவை & ரியாக்ஷன்ஸ் (Tamil Search)</h2>
        <input type="text" id="query" placeholder="Eg: Vadivelu, GP Muthu, Santhanam...">
        <button onclick="searchTamil()">Search</button>
        <p style="font-size: 12px; color: #94a3b8; margin-top: 10px;">
            Automatically searching GIPHY & Tenor with Tamil context.
        </p>
    </div>

    <div id="results" class="grid"></div>

    <script>
        const GIPHY_KEY = 'aGyfpLUGGHCk9HVWCNPxwW6adXAQzDN6';
        const TENOR_KEY = 'YxPlCYzydGSn73MGIrc8QeTFEYKu2y2D4wSntKNRbD9jA1XpmguBbJPfD95wR0pA';

        async function searchTamil() {
            const userInput = document.getElementById('query').value;
            const container = document.getElementById('results');
            if(!userInput) return;

            container.innerHTML = 'Searching Tamil content...';
            
            // KEYWORD INJECTION: We append 'Tamil' to force relevant results
            const tamilQuery = `${userInput} tamil reaction`;

            const [giphy, tenor] = await Promise.all([
                fetchGiphy(tamilQuery),
                fetchTenor(tamilQuery)
            ]);

            container.innerHTML = '';
            render(giphy, 'GIPHY');
            render(tenor, 'TENOR');
        }

        async function fetchGiphy(q) {
            try {
                const r = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=${GIPHY_KEY}&q=${q}&limit=12`);
                const j = await r.json();
                return j.data.map(img => img.images.fixed_height.url);
            } catch { return []; }
        }

        async function fetchTenor(q) {
            try {
                // Tenor v2 API (Active until June 2026)
                const r = await fetch(`https://tenor.googleapis.com/v2/search?q=${q}&key=${TENOR_KEY}&limit=12`);
                const j = await r.json();
                return j.results.map(img => img.media_formats.tinygif.url);
            } catch { return []; }
        }

        function render(links, source) {
            const container = document.getElementById('results');
            links.forEach(url => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<span class="badge">${source}</span><img src="${url}" loading="lazy">`;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
